<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Connect - Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; overflow: hidden; }
        
        /* 縦横比を考慮したビデオコンテナ */
        .video-container { 
            position: relative; width: 100%; flex: 1; min-height: 0; background-color: #000; 
            border-radius: 0.5rem; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        #localVideo { 
            position: absolute; bottom: 10px; right: 10px; width: 20%; min-width: 100px; max-width: 200px;
            height: auto; border: 2px solid #fff; border-radius: 0.25rem; background-color: #333; 
            z-index: 10; aspect-ratio: 16/9; object-fit: cover; 
        }
        
        /* チャット収納アニメーション (スマホ/PC共通) */
        #chatPanel {
            transition: transform 0.3s ease-in-out;
            z-index: 40;
        }
        @media (max-width: 768px) {
            #chatPanel {
                position: fixed; top: 0; right: 0; bottom: 0; width: 85%;
                transform: translateX(100%);
            }
            #chatPanel.open { transform: translateX(0); }
        }

        .chat-messages { height: 100%; overflow-y: auto; }
        .message { padding: 0.5rem; border-radius: 0.25rem; max-width: 85%; word-break: break-all; }
        .message.self { background-color: #dbeafe; border-bottom-right-radius: 0; }
        .message.peer { background-color: #e5e7eb; border-bottom-left-radius: 0; }

        /* CSS歯車 */
        .css-gear-wrapper { position: relative; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; transition: transform 0.3s ease; }
        .css-gear-wrapper:hover { transform: rotate(45deg); }
        .css-gear { width: 14px; height: 14px; border: 3px solid #fff; border-radius: 50%; position: relative; box-sizing: border-box; z-index: 2; }
        .css-gear::before, .css-gear::after, .css-gear-teeth::before, .css-gear-teeth::after { content: ""; position: absolute; width: 4px; height: 18px; background: #fff; top: 50%; left: 50%; border-radius: 1px; }
        .css-gear::before { transform: translate(-50%, -50%) rotate(0deg); }
        .css-gear::after { transform: translate(-50%, -50%) rotate(90deg); }
        .css-gear-teeth::before { transform: translate(-50%, -50%) rotate(45deg); }
        .css-gear-teeth::after { transform: translate(-50%, -50%) rotate(135deg); }
        .css-gear-teeth { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .css-gear-hole { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; background: #2563eb; border-radius: 50%; z-index: 3; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center z-50">
        <div class="flex items-center gap-3">
            <h1 class="text-lg font-bold"><i class="fa-solid fa-tower-broadcast mr-1"></i>P2P</h1>
            <span class="text-xs bg-blue-700 px-2 py-1 rounded hidden sm:inline">ID: <span id="myIdDisplay" class="select-all cursor-pointer">取得中...</span></span>
        </div>
        <div class="flex items-center gap-4">
            <button id="toggleChatBtn" class="bg-blue-500 hover:bg-blue-400 p-2 rounded relative" title="チャットを表示">
                <i class="fa-solid fa-comments"></i>
                <span id="chatBadge" class="absolute -top-1 -right-1 bg-red-500 text-[10px] w-4 h-4 rounded-full flex items-center justify-center hidden">!</span>
            </button>
            <button id="openSettingsBtn" class="focus:outline-none">
                <div class="css-gear-wrapper"><div class="css-gear"></div><div class="css-gear-teeth"></div><div class="css-gear-hole"></div></div>
            </button>
        </div>
    </header>

    <div id="requestModal" class="fixed inset-0 bg-black bg-opacity-70 z-[100] flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white rounded-lg shadow-2xl p-6 w-full max-w-sm text-center">
            <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-bell text-3xl text-blue-500 animate-bounce"></i>
            </div>
            <h3 id="requestMsg" class="text-lg font-bold mb-2">リクエストが来ています</h3>
            <p class="text-sm text-gray-500 mb-6">相手からの接続を許可しますか？</p>
            <div class="flex gap-3">
                <button id="rejectBtn" class="flex-1 py-3 border border-gray-300 rounded-lg font-bold text-gray-600 hover:bg-gray-50">拒否</button>
                <button id="acceptBtn" class="flex-1 py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700">許可する</button>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 z-[60] flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold"><i class="fa-solid fa-gear mr-2"></i>設定</h2>
                <button id="closeSettingsBtn" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase">基本設定</label>
                    <input type="text" id="myCustomIdInput" placeholder="希望のID" class="w-full border rounded px-3 py-2 mt-1 text-sm">
                    <input type="text" id="myNameInput" placeholder="表示名" class="w-full border rounded px-3 py-2 mt-2 text-sm">
                </div>
                
                <div class="border-t pt-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">オーディオ設定 (20Hz-20,000Hz)</label>
                    <select id="audioDeviceSelect" class="w-full border rounded px-3 py-2 text-sm mb-2"></select>
                    
                    <div class="p-3 bg-gray-50 rounded-lg space-y-2">
                        <div class="flex items-center justify-between">
                            <label class="text-sm">ハイファイモード (加工なし)</label>
                            <input type="checkbox" id="hifiModeCb" class="w-4 h-4">
                        </div>
                        <p class="text-[10px] text-gray-400">※ONにするとブラウザのノイズ除去が無効化され、全音域を通します。エコーに注意してください。</p>
                        <div id="standardAudioOptions" class="space-y-2">
                            <div class="flex items-center justify-between opacity-50">
                                <label class="text-xs">ノイズキャンセリング</label>
                                <input type="checkbox" id="noiseSuppressionCb" checked disabled>
                            </div>
                        </div>
                    </div>
                </div>

                <button id="saveSettingsBtn" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold mt-4">設定を保存してリロード</button>
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        <div class="flex-1 flex flex-col p-4 gap-4 min-h-0">
            <div class="flex flex-wrap gap-2 items-center justify-between bg-white p-3 rounded-lg shadow-sm shrink-0">
                <div class="flex gap-2 flex-1 min-w-[200px]">
                    <input type="text" id="targetIdInput" placeholder="相手のID" class="flex-1 border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
                    <button id="connectBtn" class="bg-green-500 text-white px-4 py-2 rounded text-sm font-bold">接続</button>
                </div>
                <div class="flex gap-2">
                    <button id="toggleMicBtn" class="w-10 h-10 bg-gray-300 rounded flex items-center justify-center" disabled><i class="fa-solid fa-microphone"></i></button>
                    <button id="toggleVideoBtn" class="w-10 h-10 bg-gray-300 rounded flex items-center justify-center mr-2" disabled><i class="fa-solid fa-video"></i></button>
                    <button id="videoCallBtn" class="bg-purple-500 text-white px-4 py-2 rounded text-sm font-bold shrink-0"><i class="fa-solid fa-video mr-1"></i>通話</button>
                    <button id="shareScreenBtn" class="bg-blue-500 text-white px-4 py-2 rounded text-sm font-bold shrink-0"><i class="fa-solid fa-display mr-1"></i>共有</button>
                </div>
            </div>

            <div class="video-container shadow-md">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay playsinline muted></video>
                <div id="noVideoMsg" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500">
                    <i class="fa-solid fa-video-slash text-4xl mb-2"></i>
                    <span class="text-sm">待機中...</span>
                </div>
            </div>
        </div>

        <div id="chatPanel" class="w-full md:w-80 bg-white border-l flex flex-col shadow-2xl md:shadow-none">
            <div class="p-3 border-b bg-gray-50 flex justify-between items-center shrink-0">
                <span class="font-bold text-sm"><i class="fa-solid fa-comments mr-2"></i>チャットルーム</span>
                <button id="closeChatBtn" class="md:hidden text-gray-400"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            
            <div id="chatBox" class="chat-messages p-4 flex-1"></div>

            <div class="p-3 border-t bg-white">
                <form id="chatForm" class="flex gap-2">
                    <input type="text" id="chatInput" placeholder="入力..." class="flex-1 border rounded px-3 py-2 text-sm focus:outline-none" disabled>
                    <button type="submit" id="sendBtn" class="bg-blue-600 text-white w-10 h-10 rounded flex items-center justify-center disabled:opacity-50" disabled><i class="fa-solid fa-paper-plane"></i></button>
                </form>
                <button id="clearChatBtn" class="w-full mt-2 text-[10px] text-gray-400 text-right uppercase tracking-wider">Clear History</button>
            </div>
        </div>
    </main>

    <script>
        const STORAGE_KEY_PREFIX = 'p2p_v3_';
        let peer, connection, currentCall, localStream;
        let isVideoCalling = false, isMicMuted = false, isVideoMuted = false;
        let pendingRequest = null;

        // --- 初期設定読み込み ---
        const config = {
            id: localStorage.getItem(STORAGE_KEY_PREFIX + 'custom_id') || '',
            name: localStorage.getItem(STORAGE_KEY_PREFIX + 'name') || '名無しさん',
            hifi: localStorage.getItem(STORAGE_KEY_PREFIX + 'hifi') === 'true',
            audioDev: localStorage.getItem(STORAGE_KEY_PREFIX + 'audio_dev') || ''
        };

        const dom = {
            myId: document.getElementById('myIdDisplay'),
            targetId: document.getElementById('targetIdInput'),
            chatPanel: document.getElementById('chatPanel'),
            chatBox: document.getElementById('chatBox'),
            requestModal: document.getElementById('requestModal'),
            requestMsg: document.getElementById('requestMsg')
        };

        // --- チャット開閉ロジック ---
        function toggleChat(force) {
            const isOpen = force !== undefined ? force : !dom.chatPanel.classList.contains('open');
            dom.chatPanel.classList.toggle('open', isOpen);
            document.getElementById('chatBadge').classList.add('hidden');
        }
        document.getElementById('toggleChatBtn').onclick = () => toggleChat();
        document.getElementById('closeChatBtn').onclick = () => toggleChat(false);

        // --- PeerJS セットアップ ---
        function initPeer() {
            peer = config.id ? new Peer(config.id) : new Peer();
            
            peer.on('open', id => dom.myId.textContent = id);

            // 接続要求（チャット用）
            peer.on('connection', conn => {
                showRequest('データ接続', conn.metadata?.name || '不明なユーザー', () => {
                    setupConnection(conn);
                }, () => conn.close());
            });

            // 通話要求（映像用）
            peer.on('call', call => {
                showRequest('ビデオ通話', call.metadata?.name || '不明なユーザー', async () => {
                    if (!localStream) await prepareStream(false);
                    call.answer(localStream);
                    handleCall(call);
                }, () => call.close());
            });
        }

        // --- リクエスト許可モーダル制御 ---
        function showRequest(type, name, onAccept, onReject) {
            dom.requestMsg.innerHTML = `<span class="text-blue-600">${name}</span> から<br>${type}のリクエスト`;
            dom.requestModal.style.display = 'flex';
            
            document.getElementById('acceptBtn').onclick = () => {
                dom.requestModal.style.display = 'none';
                onAccept();
            };
            document.getElementById('rejectBtn').onclick = () => {
                dom.requestModal.style.display = 'none';
                onReject();
            };
        }

        // --- オーディオ設定 (20Hz-20,000Hz対応) ---
        async function prepareStream(isScreen) {
            const audioConstraints = {
                deviceId: config.audioDev ? { exact: config.audioDev } : undefined,
                echoCancellation: !config.hifi,
                noiseSuppression: !config.hifi,
                autoGainControl: !config.hifi
            };

            try {
                if (isScreen) {
                    localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: audioConstraints });
                } else {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: audioConstraints });
                }
                document.getElementById('localVideo').srcObject = localStream;
                updateControlButtons();
            } catch (e) {
                console.error(e);
                alert("メディアの取得に失敗しましたンゴ");
            }
        }

        // --- 通信処理 ---
        function setupConnection(conn) {
            connection = conn;
            connection.on('open', () => {
                document.getElementById('chatInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                addChatSystemMsg("接続が完了しました");
            });
            connection.on('data', data => {
                if (data.type === 'chat') {
                    addChatMessage(data.text, false, data.name);
                    if (!dom.chatPanel.classList.contains('open')) {
                        document.getElementById('chatBadge').classList.remove('hidden');
                    }
                }
            });
        }

        function handleCall(call) {
            currentCall = call;
            call.on('stream', stream => {
                document.getElementById('remoteVideo').srcObject = stream;
                document.getElementById('noVideoMsg').style.display = 'none';
            });
        }

        // --- UIヘルパー ---
        function addChatMessage(text, isSelf, name) {
            const div = document.createElement('div');
            div.className = `flex flex-col mb-4 ${isSelf ? 'items-end' : 'items-start'}`;
            div.innerHTML = `
                <span class="text-[10px] text-gray-400 mb-1">${name}</span>
                <div class="message ${isSelf ? 'self' : 'peer'} shadow-sm">${text}</div>
            `;
            dom.chatBox.appendChild(div);
            dom.chatBox.scrollTop = dom.chatBox.scrollHeight;
        }

        function addChatSystemMsg(text) {
            const div = document.createElement('div');
            div.className = "text-center text-[10px] text-gray-400 my-2 italic";
            div.textContent = `--- ${text} ---`;
            dom.chatBox.appendChild(div);
        }

        function updateControlButtons() {
            const micBtn = document.getElementById('toggleMicBtn');
            const vidBtn = document.getElementById('toggleVideoBtn');
            micBtn.disabled = vidBtn.disabled = !localStream;
            micBtn.className = `w-10 h-10 rounded flex items-center justify-center ${isMicMuted ? 'bg-red-500 text-white' : 'bg-gray-200 text-gray-700'}`;
            vidBtn.className = `w-10 h-10 rounded flex items-center justify-center ${isVideoMuted ? 'bg-red-500 text-white' : 'bg-gray-200 text-gray-700'}`;
        }

        // --- イベントリスナー ---
        document.getElementById('connectBtn').onclick = () => {
            const tid = dom.targetId.value.trim();
            if (!tid) return;
            const conn = peer.connect(tid, { metadata: { name: config.name } });
            setupConnection(conn);
        };

        document.getElementById('videoCallBtn').onclick = async () => {
            const tid = dom.targetId.value.trim();
            if (!tid) return;
            await prepareStream(false);
            const call = peer.call(tid, localStream, { metadata: { name: config.name } });
            handleCall(call);
        };

        document.getElementById('shareScreenBtn').onclick = async () => {
            const tid = dom.targetId.value.trim();
            if (!tid) return;
            await prepareStream(true);
            const call = peer.call(tid, localStream, { metadata: { name: config.name } });
            handleCall(call);
        };

        document.getElementById('chatForm').onsubmit = (e) => {
            e.preventDefault();
            const text = document.getElementById('chatInput').value.trim();
            if (!text || !connection) return;
            connection.send({ type: 'chat', text, name: config.name });
            addChatMessage(text, true, config.name);
            document.getElementById('chatInput').value = '';
        };

        document.getElementById('toggleMicBtn').onclick = () => {
            isMicMuted = !isMicMuted;
            localStream.getAudioTracks().forEach(t => t.enabled = !isMicMuted);
            updateControlButtons();
        };

        document.getElementById('toggleVideoBtn').onclick = () => {
            isVideoMuted = !isVideoMuted;
            localStream.getVideoTracks().forEach(t => t.enabled = !isVideoMuted);
            updateControlButtons();
        };

        // --- 設定管理 ---
        document.getElementById('openSettingsBtn').onclick = async () => {
            document.getElementById('myCustomIdInput').value = config.id;
            document.getElementById('myNameInput').value = config.name;
            document.getElementById('hifiModeCb').checked = config.hifi;
            
            const devices = await navigator.mediaDevices.enumerateDevices();
            const audioSelect = document.getElementById('audioDeviceSelect');
            audioSelect.innerHTML = devices.filter(d => d.kind === 'audioinput')
                .map(d => `<option value="${d.deviceId}" ${d.deviceId === config.audioDev ? 'selected' : ''}>${d.label || 'マイク'}</option>`).join('');
            
            document.getElementById('settingsModal').style.display = 'flex';
        };

        document.getElementById('closeSettingsBtn').onclick = () => document.getElementById('settingsModal').style.display = 'none';

        document.getElementById('saveSettingsBtn').onclick = () => {
            localStorage.setItem(STORAGE_KEY_PREFIX + 'custom_id', document.getElementById('myCustomIdInput').value);
            localStorage.setItem(STORAGE_KEY_PREFIX + 'name', document.getElementById('myNameInput').value);
            localStorage.setItem(STORAGE_KEY_PREFIX + 'hifi', document.getElementById('hifiModeCb').checked);
            localStorage.setItem(STORAGE_KEY_PREFIX + 'audio_dev', document.getElementById('audioDeviceSelect').value);
            location.reload();
        };

        initPeer();
    </script>
</body>
</html>
