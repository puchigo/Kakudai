<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Screen Share & Chat & Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        
        /* 縦横比を考慮したビデオコンテナの調整 */
        .video-container { 
            position: relative; 
            width: 100%; 
            flex: 1; 
            min-height: 0; 
            background-color: #000; 
            border-radius: 0.5rem; 
            overflow: hidden; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* アスペクト比を維持して全体を表示 */
        }
        #localVideo { 
            position: absolute; 
            bottom: 10px; 
            right: 10px; 
            width: 20%; 
            min-width: 100px;
            max-width: 200px;
            height: auto; 
            border: 2px solid #fff; 
            border-radius: 0.25rem; 
            background-color: #333; 
            z-index: 10; 
            aspect-ratio: 16/9; 
            object-fit: cover; 
        }
        
        .chat-messages { height: 300px; overflow-y: auto; }
        .message { padding: 0.5rem; border-radius: 0.25rem; max-width: 80%; word-break: break-all; }
        .message.self { background-color: #dbeafe; border-bottom-right-radius: 0; }
        .message.peer { background-color: #e5e7eb; border-bottom-left-radius: 0; }

        /* CSSで描写した歯車アイコン */
        .css-gear-wrapper {
            position: relative; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.3s ease;
        }
        .css-gear-wrapper:hover {
            transform: rotate(45deg);
        }
        .css-gear {
            width: 14px; height: 14px;
            border: 3px solid #fff;
            border-radius: 50%;
            position: relative;
            box-sizing: border-box;
            z-index: 2;
        }
        .css-gear::before, .css-gear::after,
        .css-gear-teeth::before, .css-gear-teeth::after {
            content: ""; position: absolute;
            width: 4px; height: 18px;
            background: #fff;
            top: 50%; left: 50%;
            border-radius: 1px;
        }
        .css-gear::before { transform: translate(-50%, -50%) rotate(0deg); }
        .css-gear::after { transform: translate(-50%, -50%) rotate(90deg); }
        .css-gear-teeth::before { transform: translate(-50%, -50%) rotate(45deg); }
        .css-gear-teeth::after { transform: translate(-50%, -50%) rotate(135deg); }
        .css-gear-teeth {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }
        .css-gear-hole {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 6px; height: 6px;
            background: #2563eb;
            border-radius: 50%;
            z-index: 3;
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center z-10 relative">
        <h1 class="text-xl font-bold"><i class="fa-solid fa-desktop mr-2"></i>P2P Connect</h1>
        <div class="flex items-center gap-4">
            <span class="text-sm">現在のID: <span id="myIdDisplay" class="font-mono bg-blue-700 px-2 py-1 rounded select-all cursor-pointer" title="クリックでコピー">取得中...</span></span>
            <button id="openSettingsBtn" class="focus:outline-none" title="設定を開く">
                <div class="css-gear-wrapper">
                    <div class="css-gear"></div>
                    <div class="css-gear-teeth"></div>
                    <div class="css-gear-hole"></div>
                </div>
            </button>
        </div>
    </header>

    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center" style="display: none;">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md mx-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-gear mr-2"></i>設定</h2>
                <button id="closeSettingsBtn" class="text-gray-500 hover:text-gray-800 text-xl"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-700 mb-1">希望のID (英数字)</label>
                    <input type="text" id="myCustomIdInput" placeholder="空なら自動生成" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-700 mb-1">表示名</label>
                    <input type="text" id="myNameInput" placeholder="名無し" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-700 mb-1">アイコン画像URL</label>
                    <input type="text" id="myIconInput" placeholder="https://..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="pt-2 text-right">
                    <button id="saveSettingsBtn" class="w-full bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded transition-colors"><i class="fa-solid fa-floppy-disk mr-2"></i>設定を保存(再読込)</button>
                </div>
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col md:flex-row p-4 gap-4 overflow-hidden">
        
        <div class="flex-1 flex flex-col gap-4 min-h-0">
            <div class="bg-white p-4 rounded-lg shadow-sm flex flex-wrap items-center justify-between gap-2 shrink-0">
                <div class="flex items-center gap-2 w-full max-w-md">
                    <input type="text" id="targetIdInput" placeholder="接続先のIDを入力" class="flex-1 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="connectBtn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded transition-colors"><i class="fa-solid fa-link mr-1"></i>接続</button>
                </div>
                <div class="flex gap-2">
                    <button id="videoCallBtn" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded transition-colors shadow-sm disabled:opacity-50"><i class="fa-solid fa-video mr-1"></i>ビデオ通話</button>
                    <button id="shareScreenBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition-colors shadow-sm disabled:opacity-50"><i class="fa-solid fa-display mr-1"></i>画面共有</button>
                </div>
            </div>

            <div class="video-container shadow-md">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay playsinline muted></video>
                <div id="noVideoMsg" class="absolute inset-0 flex items-center justify-center text-gray-400">
                    <span><i class="fa-solid fa-video-slash mr-2"></i>映像は受信されていません</span>
                </div>
            </div>
        </div>

        <div class="w-full md:w-80 bg-white rounded-lg shadow-md flex flex-col shrink-0">
            <div class="p-3 border-b border-gray-200 bg-gray-50 rounded-t-lg">
                <h2 class="font-bold text-gray-700"><i class="fa-solid fa-comments mr-2"></i>チャット</h2>
                <div class="text-xs text-gray-500 mt-1">状態: <span id="connectionStatus" class="font-semibold text-gray-400">未接続</span></div>
            </div>
            
            <div id="chatBox" class="chat-messages p-3 flex-1 flex flex-col">
                </div>

            <div class="p-3 border-t border-gray-200">
                <form id="chatForm" class="flex gap-2">
                    <input type="text" id="chatInput" placeholder="メッセージを入力..." class="flex-1 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" disabled>
                    <button type="submit" id="sendBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition-colors disabled:opacity-50" disabled><i class="fa-solid fa-paper-plane"></i></button>
                </form>
                <button id="clearChatBtn" class="w-full mt-2 text-xs text-red-500 hover:text-red-700 text-right">履歴をクリア</button>
            </div>
        </div>

    </main>

    <script>
        // 設定と状態の保持
        const STORAGE_KEY_MY_ID = 'p2p_my_id';
        const STORAGE_KEY_CUSTOM_ID = 'p2p_custom_id';
        const STORAGE_KEY_NAME = 'p2p_my_name';
        const STORAGE_KEY_ICON = 'p2p_my_icon';
        const STORAGE_KEY_TARGET_ID = 'p2p_target_id';
        const STORAGE_KEY_CHAT = 'p2p_chat_history';

        let peer = null;
        let connection = null;
        let currentCall = null;
        let localStream = null;
        let isVideoCalling = false; 

        // DOM要素
        const myIdDisplay = document.getElementById('myIdDisplay');
        const myCustomIdInput = document.getElementById('myCustomIdInput');
        const myNameInput = document.getElementById('myNameInput');
        const myIconInput = document.getElementById('myIconInput');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const targetIdInput = document.getElementById('targetIdInput');
        const connectBtn = document.getElementById('connectBtn');
        const shareScreenBtn = document.getElementById('shareScreenBtn');
        const videoCallBtn = document.getElementById('videoCallBtn'); 
        const connectionStatus = document.getElementById('connectionStatus');
        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const noVideoMsg = document.getElementById('noVideoMsg');
        
        // 追加: モーダル要素
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const settingsModal = document.getElementById('settingsModal');

        // モーダルの開閉処理
        openSettingsBtn.addEventListener('click', () => {
            settingsModal.style.display = 'flex';
        });
        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        // ユーザー設定の取得
        function getUserSettings() {
            return {
                name: localStorage.getItem(STORAGE_KEY_NAME) || '名無し',
                icon: localStorage.getItem(STORAGE_KEY_ICON) || ''
            };
        }

        // 初期化
        function init() {
            loadSavedData();
            
            // PeerJSの初期化 (カスタムIDがあればそれを使用)
            const customId = localStorage.getItem(STORAGE_KEY_CUSTOM_ID);
            if (customId) {
                peer = new Peer(customId, { debug: 2 });
            } else {
                peer = new Peer({ debug: 2 });
            }

            peer.on('open', (id) => {
                myIdDisplay.textContent = id;
                localStorage.setItem(STORAGE_KEY_MY_ID, id);
            });

            // 相手からの接続要求の処理（データ通信/チャット）
            peer.on('connection', (conn) => {
                setupConnection(conn);
            });

            // 相手からの通話（画面共有/ビデオ）要求の処理
            peer.on('call', (call) => {
                // 応答する。自分が発信中ならそのストリームを返す
                call.answer(localStream);
                handleCallEvents(call);
            });

            peer.on('error', (err) => {
                console.error(err);
                if (err.type === 'unavailable-id') {
                    alert('指定されたIDは既に使用されています。別のIDに変更してください。');
                } else {
                    alert('エラーが発生しました: ' + err.type);
                }
            });

            // 設定保存イベント
            saveSettingsBtn.addEventListener('click', () => {
                localStorage.setItem(STORAGE_KEY_CUSTOM_ID, myCustomIdInput.value.trim());
                localStorage.setItem(STORAGE_KEY_NAME, myNameInput.value.trim());
                localStorage.setItem(STORAGE_KEY_ICON, myIconInput.value.trim());
                location.reload(); // 再読み込みして反映
            });

            // イベントリスナーの登録
            myIdDisplay.addEventListener('click', () => {
                navigator.clipboard.writeText(myIdDisplay.textContent);
                alert('IDをクリップボードにコピーしました');
            });

            connectBtn.addEventListener('click', () => {
                const targetId = targetIdInput.value.trim();
                if (!targetId) return;
                localStorage.setItem(STORAGE_KEY_TARGET_ID, targetId);
                const conn = peer.connect(targetId);
                setupConnection(conn);
            });

            shareScreenBtn.addEventListener('click', toggleScreenShare);
            videoCallBtn.addEventListener('click', toggleVideoCall); 

            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const text = chatInput.value.trim();
                if (!text || !connection || !connection.open) return;
                
                const settings = getUserSettings();
                
                // メッセージ送信 (名前とアイコンも送る)
                connection.send({ type: 'chat', text: text, name: settings.name, icon: settings.icon });
                addChatMessage(text, true, settings.name, settings.icon);
                saveChatHistory(text, true, settings.name, settings.icon);
                chatInput.value = '';
            });

            clearChatBtn.addEventListener('click', () => {
                if(confirm('チャット履歴を消去しますか？')) {
                    localStorage.removeItem(STORAGE_KEY_CHAT);
                    chatBox.innerHTML = '';
                }
            });
        }

        // 接続のセットアップ
        function setupConnection(conn) {
            connection = conn;
            connection.on('open', () => {
                updateStatus('接続済み', 'text-green-500');
                chatInput.disabled = false;
                sendBtn.disabled = false;
                
                // 接続できたら、もし自分が共有/通話中なら自動的に送信する
                if (localStream) {
                    const call = peer.call(connection.peer, localStream);
                    handleCallEvents(call);
                }
            });

            connection.on('data', (data) => {
                if (data && data.type === 'chat') {
                    addChatMessage(data.text, false, data.name, data.icon);
                    saveChatHistory(data.text, false, data.name, data.icon);
                }
            });

            connection.on('close', () => {
                updateStatus('切断されました', 'text-red-500');
                chatInput.disabled = true;
                sendBtn.disabled = true;
            });
        }

        // 通話（メディアストリーム）のイベントハンドリング
        function handleCallEvents(call) {
            currentCall = call;
            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                noVideoMsg.style.display = 'none';
            });
            call.on('close', () => {
                remoteVideo.srcObject = null;
                noVideoMsg.style.display = 'flex';
            });
        }

        // ストリームの停止処理共通化
        function stopLocalStream() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                localVideo.srcObject = null;
                if (currentCall) {
                    currentCall.close();
                }
            }
        }

        // 画面共有の開始/停止
        async function toggleScreenShare() {
            if (localStream && !isVideoCalling) {
                // 停止処理
                stopLocalStream();
                shareScreenBtn.innerHTML = '<i class="fa-solid fa-display mr-1"></i>画面共有';
                shareScreenBtn.classList.replace('bg-red-500', 'bg-blue-500');
                shareScreenBtn.classList.replace('hover:bg-red-600', 'hover:bg-blue-600');
                videoCallBtn.disabled = false;
                return;
            }

            try {
                if (localStream) stopLocalStream(); // ビデオ通話中なら切る
                
                // 開始処理
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: true
                });
                
                isVideoCalling = false;
                localVideo.srcObject = localStream;
                
                shareScreenBtn.innerHTML = '<i class="fa-solid fa-stop mr-1"></i>共有停止';
                shareScreenBtn.classList.replace('bg-blue-500', 'bg-red-500');
                shareScreenBtn.classList.replace('hover:bg-blue-600', 'hover:bg-red-600');
                
                // ビデオ通話ボタンのリセットと無効化
                videoCallBtn.innerHTML = '<i class="fa-solid fa-video mr-1"></i>ビデオ通話';
                videoCallBtn.classList.replace('bg-red-500', 'bg-purple-500');
                videoCallBtn.classList.replace('hover:bg-red-600', 'hover:bg-purple-600');
                videoCallBtn.disabled = true;

                // 共有がブラウザの機能で停止された場合のハンドリング
                localStream.getVideoTracks()[0].onended = () => {
                    toggleScreenShare();
                };

                // 既に接続されている相手がいれば発信
                if (connection && connection.open) {
                    const call = peer.call(connection.peer, localStream);
                    handleCallEvents(call);
                }

            } catch (err) {
                console.error("画面共有の取得に失敗しました", err);
            }
        }

        // ビデオ通話の開始/停止
        async function toggleVideoCall() {
            if (localStream && isVideoCalling) {
                // 停止処理
                stopLocalStream();
                videoCallBtn.innerHTML = '<i class="fa-solid fa-video mr-1"></i>ビデオ通話';
                videoCallBtn.classList.replace('bg-red-500', 'bg-purple-500');
                videoCallBtn.classList.replace('hover:bg-red-600', 'hover:bg-purple-600');
                shareScreenBtn.disabled = false;
                return;
            }

            try {
                if (localStream) stopLocalStream(); // 画面共有中なら切る

                // 開始処理
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });
                
                isVideoCalling = true;
                localVideo.srcObject = localStream;
                
                videoCallBtn.innerHTML = '<i class="fa-solid fa-stop mr-1"></i>通話停止';
                videoCallBtn.classList.replace('bg-purple-500', 'bg-red-500');
                videoCallBtn.classList.replace('hover:bg-purple-600', 'hover:bg-red-600');

                // 画面共有ボタンのリセットと無効化
                shareScreenBtn.innerHTML = '<i class="fa-solid fa-display mr-1"></i>画面共有';
                shareScreenBtn.classList.replace('bg-red-500', 'bg-blue-500');
                shareScreenBtn.classList.replace('hover:bg-red-600', 'hover:bg-blue-600');
                shareScreenBtn.disabled = true;

                // 既に接続されている相手がいれば発信
                if (connection && connection.open) {
                    const call = peer.call(connection.peer, localStream);
                    handleCallEvents(call);
                }

            } catch (err) {
                console.error("カメラ・マイクの取得に失敗しました", err);
                alert("カメラまたはマイクのアクセスが許可されていません。");
            }
        }

        // UI・ストレージ関連ヘルパー
        function updateStatus(text, colorClass) {
            connectionStatus.textContent = text;
            connectionStatus.className = `font-semibold ${colorClass}`;
        }

        function addChatMessage(text, isSelf, name = '名無し', iconUrl = '') {
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-2 mb-3 ${isSelf ? 'flex-row-reverse' : 'flex-row'}`;
            
            // アイコン
            const iconImg = document.createElement('img');
            // アイコンURLがない場合はダミー画像を生成
            iconImg.src = iconUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random`;
            iconImg.className = 'w-8 h-8 rounded-full object-cover shrink-0 bg-gray-200 border border-gray-300';
            
            // メッセージ本体
            const msgBox = document.createElement('div');
            msgBox.className = `message ${isSelf ? 'self' : 'peer'} text-sm flex flex-col shadow-sm`;
            msgBox.style.margin = '0'; 
            
            // 名前
            const nameSpan = document.createElement('span');
            nameSpan.className = 'text-xs text-gray-500 mb-1 font-semibold';
            nameSpan.textContent = name;
            
            // テキスト
            const textSpan = document.createElement('span');
            textSpan.textContent = text;
            
            msgBox.appendChild(nameSpan);
            msgBox.appendChild(textSpan);
            
            wrapper.appendChild(iconImg);
            wrapper.appendChild(msgBox);
            
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function saveChatHistory(text, isSelf, name, icon) {
            let history = JSON.parse(localStorage.getItem(STORAGE_KEY_CHAT) || '[]');
            history.push({ text, isSelf, name, icon });
            // 最大100件まで保持
            if (history.length > 100) history.shift();
            localStorage.setItem(STORAGE_KEY_CHAT, JSON.stringify(history));
        }

        function loadSavedData() {
            // 設定パネルの復元
            myCustomIdInput.value = localStorage.getItem(STORAGE_KEY_CUSTOM_ID) || '';
            myNameInput.value = localStorage.getItem(STORAGE_KEY_NAME) || '';
            myIconInput.value = localStorage.getItem(STORAGE_KEY_ICON) || '';

            // 前回接続した相手のID
            const savedTargetId = localStorage.getItem(STORAGE_KEY_TARGET_ID);
            if (savedTargetId) {
                targetIdInput.value = savedTargetId;
            }

            // チャット履歴
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY_CHAT) || '[]');
            history.forEach(msg => {
                addChatMessage(msg.text, msg.isSelf, msg.name, msg.icon);
            });
        }

        // 起動
        init();
    </script>
</body>
</html>
